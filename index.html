<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>삼한지 三韓志</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand"><span class="brand-ko">삼한지</span><span class="brand-hanja">三韓志</span></div>
        <div class="date" id="date"></div>
      </header>
      <main class="layout">
        <section class="map-pane"><svg id="map" role="img" aria-label="삼국 지도"></svg><svg id="battle" role="img" aria-label="전장" hidden></svg></section>
        <section class="side">
          <div class="panel info" id="info"></div>
          <div class="panel console">
            <div class="log" id="log" aria-live="polite"></div>
            <div class="prompt" id="prompt"></div>
            <div class="options" id="options"></div>
            <div class="inputrow">
              <input id="input" inputmode="numeric" autocomplete="off" aria-label="입력" />
              <button id="ok" class="btn primary">확인</button>
              <button id="cancel" class="btn">취소</button>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
